name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Vesna release tag (for example, v0.4.48)
        required: true
        type: string

jobs:
  build:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Build debug androidTest APK
        run: ./gradlew assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: vesna-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Independently build unsigned release APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-build-cache

      - name: Upload unsigned release APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: vesna-launcher-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Verify release APK and publish on tag push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: github.event_name == 'push'
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - name: Restore release keystore
        if: github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vesna-release.keystore"

      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          VESNA_RELEASE_KEYSTORE: ${{ runner.temp }}/vesna-release.keystore
          VESNA_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          VESNA_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          VESNA_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-build-cache

      - name: Download published signed APK
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p app/build/outputs/apk/release
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "VesnaLauncher-${RELEASE_TAG#v}.apk" \
            --output app/build/outputs/apk/release/app-release.apk -- "$RELEASE_TAG"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Download independent unsigned APK
        uses: actions/download-artifact@v8
        with:
          name: vesna-launcher-unsigned-release-apk
          path: ${{ runner.temp }}/unsigned-release

      - name: Verify release APK is reproducible
        run: |
          python3 -m venv "$RUNNER_TEMP/apk-repro-check"
          "$RUNNER_TEMP/apk-repro-check/bin/pip" install apksigcopier==1.1.1
          signed=app/build/outputs/apk/release/app-release.apk
          rebuilt="$RUNNER_TEMP/reproduced-release.apk"
          "$RUNNER_TEMP/apk-repro-check/bin/apksigcopier" copy \
            "$signed" "$RUNNER_TEMP/unsigned-release/app-release-unsigned.apk" "$rebuilt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$rebuilt"
          cmp "$signed" "$rebuilt"

      - name: Name release APK
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "VesnaLauncher-${VERSION}.apk"

      - name: Attach APK to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: VesnaLauncher-*.apk
